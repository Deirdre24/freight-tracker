<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,"><title>Shipment tracking: SHP-24817</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#12171d;--mut:#5d6773;--line:#e0e5ea;--acc:#0b6e6e;--fg:#fff;--okb:#e4f4ec;--ok:#0f6a41;--wb:#fdf0dc;--w:#8a4b08;--rb:#fde8e4;--r:#a3200f;--water:#cfe1ea;--land:#f3f1ea;--coast:#c9c4b6;--route:#9aa6b2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#151d25;--ink:#e8eef4;--mut:#9fb0c0;--line:#26343f;--acc:#4fd1c5;--fg:#06201d;--okb:#12301f;--ok:#7be0a4;--wb:#3a2a10;--w:#f6c46a;--rb:#3a1a16;--r:#f59a8c;--water:#0b1620;--land:#17283a;--coast:#2b4258;--route:#5f7a90}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#151d25;--ink:#e8eef4;--mut:#9fb0c0;--line:#26343f;--acc:#4fd1c5;--fg:#06201d;--okb:#12301f;--ok:#7be0a4;--wb:#3a2a10;--w:#f6c46a;--rb:#3a1a16;--r:#f59a8c;--water:#0b1620;--land:#17283a;--coast:#2b4258;--route:#5f7a90}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
#app{max-width:1280px;margin:0 auto;padding:20px 20px 48px}
h1{margin:4px 0 0;font-size:26px;font-weight:600}h2{margin:0 0 10px;font-size:16px;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:13px}.mono{font-family:'IBM Plex Mono',monospace}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select,button{font:inherit;color:var(--ink)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
.vs{display:flex;gap:4px;margin:16px 0 6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.vs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;min-height:44px;color:var(--mut);white-space:nowrap;cursor:pointer}
.vs button[aria-selected=true],.tb button[aria-selected=true]{color:var(--acc);border-color:var(--acc);font-weight:600}
.note{margin:6px 0 18px;color:var(--mut);font-size:13px}
.ch{font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap;height:fit-content;display:inline-block}
.ch.w{background:var(--wb);color:var(--w)}.ch.ok{background:var(--okb);color:var(--ok)}.ch.r{background:var(--rb);color:var(--r)}.ch.g{background:var(--line);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.btn{background:var(--acc);color:var(--fg);border:0;border-radius:8px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--mut);padding:10px 16px}td{padding:13px 16px;border-top:1px solid var(--line)}
.lnk{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer;padding:8px 0;min-height:44px}
.mapv{position:relative;height:660px;border-radius:10px;overflow:hidden;border:1px solid var(--line);color:var(--ink)}
.mapv>.mp{position:absolute;inset:0}
.pn{position:absolute;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list{left:16px;top:16px;bottom:16px;width:300px}.det{right:16px;top:16px;width:320px}.tg{left:332px;top:16px;display:flex;gap:6px;padding:6px;flex-wrap:wrap}
.tg button{background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:40px;color:var(--mut);cursor:pointer}
.tg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--fg)}
.lbl{color:var(--mut);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:14px 14px 8px}
.rw{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.rw.sel{box-shadow:inset 3px 0 var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 14px}.kv b{display:block;font-weight:500;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 300px;gap:20px}.fx{padding:13px 16px;border-top:1px solid var(--line)}.fx:first-child{border:0}.fx span{display:block;color:var(--mut);font-size:12px}
.tb{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}.tb button{background:none;border:0;border-bottom:3px solid transparent;padding:12px;min-height:44px;color:var(--mut);cursor:pointer;white-space:nowrap}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:24px}.kpi div{padding:16px 18px;border-left:1px solid var(--line)}.kpi div:first-child{border:0}.kpi b{display:block;font-size:24px;font-weight:600;margin-top:4px}
.ms{display:grid;grid-template-columns:120px 24px 1fr 240px;gap:0 18px;padding-bottom:26px}.dt{text-align:right;color:var(--mut);font-size:13px}
.ln{position:relative}.ln:before{content:"";position:absolute;left:10px;top:0;bottom:-26px;width:2px;background:var(--line)}.dot{position:relative;width:22px;height:22px;border-radius:50%;background:var(--bg);border:3px solid var(--acc)}.dot.w{border-color:var(--w)}.dot.g{border-color:var(--route)}
.ms h3{margin:0 0 4px;font-size:16px}.ms p{margin:0;color:var(--mut);max-width:520px}.sn{width:240px;height:140px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.sn svg{width:100%;height:100%;display:block}
@media (max-width:820px){.g2{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.kpi div:nth-child(3){border-left:0}.mapv{height:auto;display:flex;flex-direction:column}.mapv>.mp{position:relative;height:320px}.pn{position:static;width:auto;margin:8px}.ms{grid-template-columns:24px 1fr}.dt{grid-column:2;text-align:left;order:-1;margin-left:0}.ms .ln{grid-row:1/4;grid-column:1}.ms>div:nth-child(3),.ms>.sn{grid-column:2}.sn{width:100%}}
.mp{width:100%;height:100%;min-height:140px}.pm{width:12px;height:12px}.pm i{display:block;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}.pm span{position:absolute;left:16px;top:-3px;white-space:nowrap;font-size:12px;font-weight:500;color:var(--ink);text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card)}.vm{color:var(--acc)}.no-ves .vm{display:none}.no-port .pm{display:none}
</style>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script></head>
<body>
<div id="app"></div>
<script>
const LAND='M300 230C340 215 400 220 470 225L560 240 600 330 560 470 420 500H360C345 440 330 380 318 320 310 280 295 250 300 230Z M380 0H800V150C700 140 640 170 580 150 540 140 520 120 480 130 440 140 420 110 400 90 385 60 390 30 380 0Z M380 100C400 130 440 150 470 140L480 170C440 190 400 185 380 160Z';
const RT='M326 372C250 300 230 200 300 150 360 110 480 100 592 96',DONE='M326 372C250 300 230 200 300 150';
const ROLES={ops:['Operations','map'],docs:['Documentation and customs','focus'],cs:['Customer service','story'],fin:['Finance and planning','data']};
const VIEWS=[['map','Live map'],['focus','Focused'],['story','Story'],['data','Data']];
const S={theme:'light',list:[],role:'ops',view:'map',tab:'docs',L:{ves:1,port:1,wx:1,cg:1},
docs:[{n:'Bill of lading',ok:1,d:'22 Oct'},{n:'Packing list',ok:1,d:'21 Oct'},{n:'Export declaration',ok:1,d:'21 Oct'},{n:'Commercial invoice',ok:0,d:'Not uploaded'}],
log:[['28 Oct 09:12','Position update received. Speed 14.2 kn.'],['27 Oct 16:30','Weather alert raised for planned lane.'],['26 Oct 03:40','Delay at Las Palmas. ETA recalculated and customer notified.'],['22 Oct 14:05','Departed Walvis Bay.']],
legs:[['1','Gaborone to Mamuno border','Road','15 Oct','15 Oct','0 h'],['2','Mamuno border crossing','Border','16 Oct','16 Oct','0 h'],['3','Mamuno to Walvis Bay','Road','20 Oct','20 Oct','0 h'],['4','Walvis Bay terminal dwell','Port','22 Oct','22 Oct','0 h'],['5','Walvis Bay to Las Palmas','Sea','25 Oct','26 Oct','+14 h'],['6','Las Palmas to Rotterdam','Sea','11 Nov','12 Nov','+14 h']]};
const nd=()=>S.docs.filter(d=>d.ok).length;
const chip=(t,k='w')=>`<span class="ch ${k}">${t}</span>`;
function head(){const d=ROLES[S.role][1];return `<div class="top"><div><div class="mut sm"><b>[Company name]</b> · Freight control · Shipments / SHP-24817</div><h1>Gaborone to Rotterdam</h1></div><div class="ctl"><label class="sm mut" for="th">Theme</label><select id="th">${['light','dark','auto'].map(t=>`<option value="${t}"${t==S.theme?' selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select><label class="sm mut" for="role">Signed in as</label><select id="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}"${k==S.role?' selected':''}>${v[0]}</option>`).join('')}</select></div></div><div class="vs" role="tablist" aria-label="Views">${VIEWS.map(([k,n])=>`<button role="tab" aria-selected="${S.view==k}" data-act="view" data-v="${k}">${n}</button>`).join('')}</div><p class="note">Default view for ${ROLES[S.role][0]}: ${VIEWS.find(v=>v[0]==d)[1]}. Every view reads the same shipment record, so changes show up everywhere.</p>`}
function vMap(){const L=S.L,tg=[['ves','Vessels'],['port','Ports'],['wx','Weather'],['cg','Congestion']];
const rows=S.list.map(x=>[x.id,x.route,x.delay_hours>6?chip('Delayed +'+Math.round(x.delay_hours)+' h'):chip('On time','ok')]);
return `<div class="mapv"><div class="mp" data-map="main" role="img" aria-label="Live map of shipment SHP-24817"></div><div class="pn list"><div class="lbl">Active shipments · ${S.list.length}</div>${rows.map((r,i)=>`<div class="rw${r[0]=='SHP-24817'?' sel':''}"><div><b>${r[0]}</b><div class="mut sm">${r[1]}</div></div>${r[2]}</div>`).join('')}</div><div class="pn tg">${tg.map(([k,n])=>`<button aria-pressed="${!!L[k]}" data-act="layer" data-v="${k}">${n}</button>`).join('')}</div><div class="pn det"><div class="lbl">Selected</div><div style="padding:0 14px 12px"><b style="font-size:19px">SHP-24817</b><div class="mut sm">MV Kalahari Star · 2 containers</div></div><div class="kv"><div><span class="mut sm">ETA</span><b class="mono">12 Nov 06:00</b></div><div><span class="mut sm">Variance</span><b class="mono">+14 h</b></div><div><span class="mut sm">Speed</span><b class="mono">14.2 kn</b></div><div><span class="mut sm">Documents</span><b class="mono">${nd()} of 4</b></div></div><div class="rw" style="color:var(--w)">${WX?`Wind ${WX.w} km/h, gusts ${WX.g} km/h at the vessel (Open-Meteo)`:'Weather data unavailable'}</div></div></div>`}
function docsT(){return `<div class="scroll"><table><tr><th>Document</th><th>Status</th><th>Updated</th><th></th></tr>${S.docs.map((d,i)=>`<tr><td>${d.n}</td><td>${d.ok?chip('Verified','ok'):chip('Missing, blocks customs','r')}</td><td>${d.d}</td><td>${d.ok?'<button class="lnk">View</button>':'<button class="lnk" data-act="upload">Upload</button>'}</td></tr>`).join('')}</table></div>`}
function logT(){return `<div class="scroll"><table>${S.log.map(l=>`<tr><td class="mono" style="width:150px;white-space:nowrap">${l[0]}</td><td>${l[1]}</td></tr>`).join('')}</table></div>`}
function vFocus(){const t=S.tab,tabs=[['over','Overview'],['docs','Documents · '+S.docs.length],['act','Activity']];
const over=`<div style="padding:18px 16px"><b>Next step</b><p class="mut" style="margin:4px 0 0">${nd()<4?'Upload the commercial invoice so customs pre-clearance can start before arrival.':'All documents are verified. Pre-clearance can start.'}</p></div>`;
return `<div class="g2"><div><div class="card" style="height:340px"><div class="mp" data-map="focus" role="img" aria-label="Route map with vessel position"></div></div><div class="card" style="margin-top:20px"><div class="tb" role="tablist">${tabs.map(([k,n])=>`<button role="tab" aria-selected="${t==k}" data-act="tab" data-v="${k}">${n}</button>`).join('')}</div>${t=='over'?over:t=='docs'?docsT():logT()}</div></div><div class="card">${[['Vessel','MV Kalahari Star'],['ETA Rotterdam','12 Nov, 06:00 (was 11 Nov)'],['Cargo','2 x 40 ft reefer containers'],['Incoterm','[Incoterm]'],['Reefer temperature','[Live reading]'],['Carrier','[Carrier name]'],['Last position','09:12 today']].map(f=>`<div class="fx"><span>${f[0]}</span><b>${f[1]}</b></div>`).join('')}<div class="fx"><button class="btn" style="width:100%">Share tracking link</button></div></div></div>`}
function vStory(){const ms=[['22 Oct, 14:05','','Departed Walvis Bay','Loaded and cleared on schedule. Both containers sealed and confirmed.','Walvis Bay'],['26 Oct, 03:40','w','Delayed at Las Palmas','Bunkering queue pushed the call back 14 hours. ETA recalculated and the customer was notified.','Las Palmas'],['Today, 09:12','','In transit, approaching Biscay','Holding 14.2 knots. A storm cell is forecast on the lane within 18 hours.','vessel'],['12 Nov, 06:00 (est.)','g','Arrival at Rotterdam',nd()<4?'Berth window not confirmed. Customs pre-clearance is waiting on the commercial invoice.':'Berth window pending. Documents are complete for pre-clearance.','Rotterdam']];
return ms.map(m=>`<div class="ms"><div class="dt">${m[0]}</div><div class="ln"><div class="dot ${m[1]}"></div></div><div><h3>${m[2]}</h3><p>${m[3]}</p></div><div class="sn"><div class="mp" data-map="snap" data-focus="${m[4]}" role="img" aria-label="Map: ${m[2]}"></div></div></div>`).join('')}
function vData(){return `<div class="card kpi"><div><span class="mut sm">ETA</span><b class="mono">12 Nov</b></div><div><span class="mut sm">Variance</span><b class="mono" style="color:var(--w)">+14 h</b></div><div><span class="mut sm">Route complete</span><b class="mono">38%</b></div><div><span class="mut sm">Documents</span><b class="mono">${nd()} of 4</b></div></div><h2>Route legs</h2><div class="card scroll" style="margin-bottom:24px"><table><tr><th>Leg</th><th>Route</th><th>Mode</th><th>Planned</th><th>Actual / ETA</th><th>Variance</th></tr>${S.legs.map(l=>`<tr>${l.map((c,i)=>`<td${i>2?' class="mono"':''}>${c}</td>`).join('')}</tr>`).join('')}</table></div><h2>Activity log</h2><div class="card">${logT()}</div>`}
function render(){const V={map:vMap,focus:vFocus,story:vStory,data:vData};const y=window.scrollY;document.getElementById('app').innerHTML=head()+V[S.view]();window.scrollTo(0,y);mountMaps()}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
if(a=='view')S.view=v;else if(a=='tab')S.tab=v;else if(a=='layer'){S.L[v]=!S.L[v];b.setAttribute('aria-pressed',!!S.L[v]);applyLayers();return}
else if(a=='upload'){upload();return}
render()});
document.getElementById('app').addEventListener('change',e=>{if(e.target.id=='th'){S.theme=e.target.value;applyTheme();render();return}if(e.target.id=='role'){S.role=e.target.value;S.view=ROLES[S.role][1];render()}});
const MAPS=[];let TRACK=null,WX=null;
const mapStyle=()=>{const d=S.theme=='dark'||(S.theme=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);return 'https://basemaps.cartocdn.com/gl/'+(d?'dark-matter':'positron')+'-gl-style/style.json'};
function applyLayers(){MAPS.forEach(m=>{const c=m.getContainer();c.classList.toggle('no-ves',!S.L.ves);c.classList.toggle('no-port',!S.L.port);['cg','wx'].forEach(k=>{try{if(m.getLayer(k))m.setLayoutProperty(k,'visibility',S.L[k]?'visible':'none')}catch(e){}})})}
function mountMaps(){
MAPS.splice(0).forEach(m=>{try{m.remove()}catch(e){}});
document.querySelectorAll('[data-map]').forEach(el=>{
if(!window.maplibregl||!TRACK){el.textContent='Map unavailable';el.style.cssText+=';display:grid;place-items:center;color:var(--mut)';return}
const T=TRACK,f=el.dataset.focus,snap=!!f;let b;
if(f){const q=f=='vessel'?{lon:T.vessel.lon,lat:T.vessel.lat}:T.ports.find(p=>p.name==f);b=[[q.lon-5,q.lat-3],[q.lon+5,q.lat+3]]}
else{const a=[].concat(...T.segments.map(s=>s.points));b=[[Math.min(...a.map(p=>p[0])),Math.min(...a.map(p=>p[1]))],[Math.max(...a.map(p=>p[0])),Math.max(...a.map(p=>p[1]))]]}
const m=new maplibregl.Map({container:el,style:mapStyle(),bounds:b,fitBoundsOptions:{padding:snap?0:50},interactive:!snap,attributionControl:snap?false:{compact:true}});
MAPS.push(m);
if(!snap)m.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
T.ports.forEach(p=>{const e=document.createElement('div');e.className='pm';e.innerHTML='<i></i>'+(snap?'':'<span>'+p.name+'</span>');new maplibregl.Marker({element:e}).setLngLat([p.lon,p.lat]).addTo(m)});
const v=document.createElement('div');v.className='vm';v.innerHTML='<svg width="28" height="28" viewBox="-14 -14 28 28" style="display:block;transform:rotate('+T.vessel.heading+'deg)"><circle r="13" fill="currentColor" opacity=".25"/><polygon points="0,-9 6,7 -6,7" fill="currentColor"/></svg>';
new maplibregl.Marker({element:v}).setLngLat([T.vessel.lon,T.vessel.lat]).addTo(m);
m.on('load',()=>{const cs=getComputedStyle(document.documentElement),acc=cs.getPropertyValue('--acc').trim()||'#0b6e6e',rt=cs.getPropertyValue('--route').trim()||'#9aa6b2';
const ln=(id,pts,paint)=>{m.addSource(id,{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:pts}}});m.addLayer({id,type:'line',source:id,layout:{'line-cap':'round','line-join':'round'},paint})};
const road=T.segments.find(s=>s.mode=='road'),sea=T.segments.find(s=>s.mode=='sea');
if(road)ln('road',road.points,{'line-color':acc,'line-width':3});
if(sea)ln('plan',sea.points,{'line-color':rt,'line-width':2.5,'line-dasharray':[2,2]});
ln('done',T.trail,{'line-color':acc,'line-width':4});
const pt=(lon,lat,props)=>({type:'Feature',properties:props||{},geometry:{type:'Point',coordinates:[lon,lat]}});
const hl=['match',['get','l'],'high','#ef4444','medium','#f59e0b','#10b981'];
m.addSource('cg',{type:'geojson',data:{type:'FeatureCollection',features:T.ports.filter(p=>p.waiting>0).map(p=>pt(p.lon,p.lat,{n:p.waiting,l:p.congestion}))}});
m.addLayer({id:'cg',type:'circle',source:'cg',paint:{'circle-radius':['+',8,['*',2.5,['get','n']]],'circle-color':hl,'circle-opacity':.22,'circle-stroke-color':hl,'circle-stroke-width':1.5}});
if(WX){const c=WX.w>40?'#f59e0b':'#38bdf8';m.addSource('wx',{type:'geojson',data:pt(T.vessel.lon,T.vessel.lat)});m.addLayer({id:'wx',type:'circle',source:'wx',paint:{'circle-radius':45,'circle-color':c,'circle-opacity':.2,'circle-stroke-color':c,'circle-stroke-width':1.5}})}
applyLayers()})})}
function loadList(){fetch('/api/shipments?status=active').then(r=>r.json()).then(l=>{S.list=l;render()}).catch(()=>{})}
function loadTrack(){fetch('/api/shipments/SHP-24817/track').then(r=>r.ok?r.json():Promise.reject()).then(t=>{TRACK=t;return fetch('https://api.open-meteo.com/v1/forecast?latitude='+t.vessel.lat+'&longitude='+t.vessel.lon+'&current=wind_speed_10m,wind_gusts_10m').then(r=>r.json()).then(j=>{WX={w:Math.round(j.current.wind_speed_10m),g:Math.round(j.current.wind_gusts_10m)}}).catch(()=>{})}).catch(()=>{}).then(()=>render())}
function load(){fetch('/api/shipments/SHP-24817').then(r=>r.ok?r.json():Promise.reject()).then(j=>{S.docs=j.documents.map(d=>({id:d.id,n:d.name,ok:d.verified,d:d.updated}));S.log=j.events.map(e=>[e.ts,e.text]);S.legs=j.legs.map(l=>[String(l.seq),l.route,l.mode,l.planned,l.actual,(l.variance_h>0?'+':'')+l.variance_h+' h']);render()}).catch(()=>{})}
function upload(){const d=S.docs.find(x=>!x.ok);if(!d)return;if(!d.id){d.ok=1;d.d='today';render();return}fetch('/api/shipments/SHP-24817/documents/'+d.id+'/verify',{method:'POST'}).then(load).catch(()=>{d.ok=1;render()})}
function applyTheme(){if(S.theme=='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=S.theme}applyTheme();const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]==h))S.view=h;
render();load();loadList();loadTrack();
</script>
</body>
</html>
